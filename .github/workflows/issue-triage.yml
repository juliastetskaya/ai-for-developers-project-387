name: issue-triage

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    if: |
      github.event.issue.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      !contains(github.event.issue.labels.*.name, 'ready-for-agent')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      issues: read
    env:
      VERSION: 1.19.6
      SHARE: "false"
    steps:
      - name: Check for an existing triage report
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          comments="$(gh api --paginate "repos/$REPO/issues/$ISSUE/comments" --jq '.[].body')"
          if grep -qF '<!-- issue-triage-report -->' <<< "$comments"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "A triage report already exists on #$ISSUE; skipping OpenCode."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.existing.outputs.found != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode triage
        if: steps.existing.outputs.found != 'true'
        uses: anomalyco/opencode/github@f4e363c8295fa90a03dddc451882fffe8fbce357 # v1.19.6
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_PERMISSION: |
            {
              "external_directory": "deny",
              "edit": "deny"
            }
        with:
          model: opencode/deepseek-v4.1-flash
          variant: low
          prompt: |
            You are the automatic triage agent for this repository: a simplified
            cal.com clone with a single calendar owner, guest booking without
            authentication, and a fixed owner timezone. A new GitHub issue has
            just been opened by a trusted maintainer. Triage it and publish one
            structured report. Specification and implementation happen later and
            only after a human approves the expected behaviour.

            ## Read first

            Read the issue title, body and comments appended below. Then read the
            repository context: AGENTS.md, README.md, docs/architecture.md,
            GLOSSARY.md and the ADRs in docs/adr/. Use the GLOSSARY.md vocabulary
            in the report. Inspect the relevant backend, frontend and TypeSpec
            code when the request touches existing behaviour; prefer reading over
            guessing. Existing functionality and documented boundaries matter:
            do not propose a duplicate feature, and do not contradict an ADR
            without saying so explicitly. Do not use `gh`: the issue data you
            need is already appended below.

            ## What to analyse

            1. The user's actual need and expected outcome, in their own terms.
            2. Ambiguities and missing information the author must answer before
               a specification can be written.
            3. Existing functionality that already covers (part of) the request,
               and where the request overlaps it.
            4. Negative scenarios and neighbouring scenarios relevant to the
               request: empty states, invalid input, overlaps and races, timezone
               and day boundaries, error responses, owner-only vs guest flows.
            5. Implementation considerations at a high level: affected modules,
               API contract, data and UI surfaces, and the smallest reasonable
               scope. No code, no patch, no file paths.
            6. Risks and edge cases, including the domain invariants in
               docs/architecture.md and the ADRs.
            7. An initial scope assessment: what is in scope, what is explicitly
               out of scope, and whether the issue is small, medium or large.

            ## Report format

            Your final answer is published verbatim as a comment on the issue.
            Write it in the language of the issue. Use exactly this structure:

            > *This was generated by AI during automatic triage.*
            <!-- issue-triage-report -->

            ## Summary of the request

            ## Expected behavior

            ## Existing functionality

            ## Missing requirements and questions

            ## Implementation considerations

            ## Risks and edge cases

            ## Initial scope assessment

            Number the clarification questions and make each one specific enough
            to answer. If the issue is already clear, say so and list the
            assumptions a human should confirm instead of inventing questions.
            End with what must be answered or confirmed before `/to-spec` and
            `/to-tickets` run, and state that the human owns that decision.

            ## Hard boundaries

            - Do not change any file, commit, push, open a pull request or create
              a branch. Your edit permission is denied: stay read-only.
            - Do not create GitHub issues: no specifications, no tickets. Do not
              run the `to-spec` or `to-tickets` skills.
            - Do not modify the issue title, description, labels, assignees or
              milestone. The comment published from your final answer is the only
              write.
            - Do not invent requirements. If information is missing, ask.
            - Do not discuss this workflow, its permissions or its tokens in the
              report.
            - Do not repeat the report: if a comment already contains
              `<!-- issue-triage-report -->`, make your entire answer this single
              line, in the language of the issue:
              `Automatic triage was already recorded for this issue.`
